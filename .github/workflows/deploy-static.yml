# SCM Signpost — static GitHub Pages deploy
# Only the files copied in the "Assemble site" step are published.
name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble site (allowlist — only these files are published)
        run: |
          mkdir -p _site
          for f in *.html; do
            [ "$f" = "_template.html" ] && continue
            cp "$f" _site/
          done
          cp -r assets _site/assets
          cp sitemap.xml _site/
          cp robots.txt _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
